####### LINUX SCHEDULERS; triggered from Git changes

def make_schedulers(project_name):
    project = projects[project_name]
    ret = []

    match project["schedulerType"]:
        case "default":
            ret.append(_make_scheduler(project_name))
        case "release":
            ret.append(_make_release_scheduler(project_name))
        case "next":
            ret.append(_make_next_scheduler(project_name))
        case "stable":
            ret.append(_make_stable_scheduler(project_name, project["kernel"]["branch"]))
        case "rolling_stable":
            ret.append(_make_rolling_stable_scheduler(project_name, project["kernel"]["branch"]))

    _make_git_bisect_scheduler(project_name)
    return ret

c["schedulers"] = []

for project_name in projects:
    c["schedulers"] += make_schedulers(project_name)

