####### CHANGESOURCES
# the 'change_source' setting tells the buildmaster how it should find out
# about source code changes.

def make_gitpoller(project_name):
    project = projects[project_name]

    if "local" in project["kernel"]:
        return None

    return changes.GitPoller(
        project["kernel"]["remote"],
        project=project_name,
        workdir=f"gitpoller-workdir-{project["workdir"] if "workdir" in project else project_name}",
        branches=[project["kernel"]["branch"]],
        pollAtLaunch=True,
        buildPushesWithNoCommits=True,
        pollInterval=project["pollInterval"],
    )

c["change_source"] = [y for x in projects if (y := make_gitpoller(x))]

####### SCHEDULERS

# regex devnotes:
# ^Linux .*\d\.\d.?\.\d.*                           = Linux x.xx.xxxxxx

# ^Linux .*\d\.\d.*                                 = Linux x.xxx
# ^Linux .*6.67|6\.[6-9][8-9].*|[7-9]\.[0-9].*      = Linux 6.67 or bigger

# Configure the Schedulers, which decide how to react to incoming changes.
# ^Linux (5\\.15.*$|[6-9]\\.[0-9]|[6-9]\\.[0-9\\].*$){1,2}(-rc[1-9][0-9]?)?$i
#
# ^Linux (5\\.1[5-9].*$|5\\.[2-9].*$|[6-9]\\.[0-9].*$|[1-9][0-9]\\.[0-9].*$){1,2}(-rc[1-9][0-9]?)?$       #works

def change_commit_is_release(change):
    # if re.search('^Linux (5\\.15.*$|[6-9]\\.[0-9]){1,2}(-rc[1-9][0-9]?)?$', change.comments):
    if re.search('^Linux (5\\.1[5-9].*|5\\.[2-9].*|[6-9]\\.[0-9].*|[1-9][0-9]\\.[0-9].*)', change.comments):
        print("Matched commit for release: " + str(change.comments))
        return True

def change_commit_is_next(change):
    if re.search('^Add linux-next specific files for.*', change.comments):
        print("Matched commit for linux next release: " + str(change.comments))
        return True

def change_commit_is_rolling_stable(change):
    if re.search('^Merge v(5\\.1[5-9].*|5\\.[2-9].*|[6-9]\\.[0-9].*|[1-9][0-9]\\.[0-9].*)', change.comments):
        print("Matched commit for release: " + str(change.comments))
        return True

def _make_scheduler(project_name):
    project = projects[project_name]

    return schedulers.SingleBranchScheduler(
        name=project["schedulerName"],
	    change_filter=util.ChangeFilter(
            project=project_name,
            branch=project["kernel"]["branch"]
        ),
        treeStableTimer=project["pollCooldown"],
	    builderNames=project["builderNames"],
    )

def _make_release_scheduler(project_name):
    project = projects[project_name]

    return schedulers.SingleBranchScheduler(
        name=project["schedulerName"],
        fileIsImportant=change_commit_is_release,
	    change_filter=util.ChangeFilter(
            project=project_name,
            branch=project["kernel"]["branch"]
        ),
        treeStableTimer=project["pollCooldown"],
	    builderNames=project["builderNames"],
    )

def _make_next_scheduler(project_name):
    project = projects[project_name]

    return schedulers.SingleBranchScheduler(
        name=project["schedulerName"],
        fileIsImportant=change_commit_is_next,
	    change_filter=util.ChangeFilter(
            project=project_name,
            branch=project["kernel"]["branch"]
        ),
        treeStableTimer=project["pollCooldown"],
	    builderNames=project["builderNames"],
    )

def _make_stable_scheduler(project, branch):
    project = projects[project_name]

    return schedulers.SingleBranchScheduler(
        name=f"{project["schedulerName"]}_{branch}",
        fileIsImportant=change_commit_is_release,
	    change_filter=util.ChangeFilter(
            branch=branch.replace("_", "."),
        ),
        treeStableTimer=project["pollCooldown"],
	    builderNames=project["builderNames"],
    )

def _make_rolling_stable_scheduler(project_name, branch):
    project = projects[project_name]

    return schedulers.SingleBranchScheduler(
        name=f"{project["schedulerName"]}_{branch}",
        fileIsImportant=change_commit_is_rolling_stable,
	    change_filter=util.ChangeFilter(
            branch=branch.replace("_", "."),
        ),
        treeStableTimer=project["pollCooldown"],
	    builderNames=project["builderNames"],
    )

def _make_git_bisect_scheduler(project_name):
    project = projects[project_name]

    return schedulers.Triggerable(
        name=f"git_bisect_{project["schedulerName"]}",
        builderNames=project["builderNames"],
        priority=10,
    )

